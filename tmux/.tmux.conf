
set -g default-terminal "tmux-256color"
# True color + italics for modern terminals. The client here reports
# xterm-ghostty, so the old "xterm-256color:RGB" pattern never matched and the
# status line was downgraded to 256-color approximations of the theme.
set -as terminal-features ",xterm-ghostty:RGB"

# Let apps (nvim, etc.) put text on the *local* terminal's clipboard via OSC 52.
# Without this tmux swallows the escape sequence and the copy stays remote.
set -g set-clipboard on

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Show pane numbers; if the window was zoomed, re-zoom after choosing a pane.
bind-key q set -gF @was_zoomed "#{window_zoomed_flag}" \; display-panes "select-pane -t '%%' \; if -F '#{@was_zoomed}' 'resize-pane -Z'"


unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# New windows/panes inherit the active pane's current directory.
bind c new-window -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind-key < swap-window -t -
bind-key > swap-window -t +

bind -r p last-window # move to last window
# Agents ring a bell (Claude/Codex hooks) when done or waiting for input.
# a: next waiting window in this session; A: pick one across all sessions.
bind a next-window -a
bind A choose-tree -Zw -f '#{window_bell_flag}'
# Ghostty maps Cmd+Opt+Left/Right to C-M-Left/Right (browser-style tab switching)
bind -n C-M-Left previous-window
bind -n C-M-Right next-window

bind -r m resize-pane -Z

# Cycle panes by number, keeping the selected pane maximized.
bind -r N select-pane -Z -t :.+ \; if-shell -F '#{==:#{window_zoomed_flag},0}' 'resize-pane -Z'
bind -r P select-pane -Z -t :.- \; if-shell -F '#{==:#{window_zoomed_flag},0}' 'resize-pane -Z'
bind -r ';' select-pane -Z -l \; if-shell -F '#{==:#{window_zoomed_flag},0}' 'resize-pane -Z'

bind -r b select-layout tiled
bind -r H select-layout even-horizontal
bind -r V select-layout even-vertical
bind -r = select-layout main-vertical \; resize-pane -t 0 -x 50%
bind -r + resize-pane -t 1 -y 50% \; resize-pane -t 2 -y 50%

# Swap/flip panes (mirror positions) - directional
bind -r BTab swap-pane -s '{left-of}'    # swap with pane to the left (Shift-Tab)
bind -r Tab swap-pane -s '{right-of}'    # swap with pane to the right (Tab)
bind -r J swap-pane -s '{down-of}'       # swap with pane below
bind -r K swap-pane -s '{up-of}'         # swap with pane above

bind-key n command-prompt -p "Rename pane:" "select-pane -T '%%'"

# Minimize pane (break out to hidden window) / restore it back
bind-key M break-pane -d  # minimize: send pane to its own window (hidden, -d = don't switch to it)
bind-key R choose-window 'join-pane -s "%%"'  # restore: pick minimized pane within current session

# Close tracked, untouched shells in this window, retaining the active pane.
bind-key X confirm-before -p 'Close untouched shells in this window? (y/n)' "run-shell -b 'bash ~/.tmux/close-idle-panes.sh #{window_id} #{pane_id}'"

set -g mouse on
# Flag bells from background windows only; the active one needs no alert.
set -g bell-action other
# Window names follow the active pane's directory, so `tm`-created windows
# keep showing their checkout/worktree instead of the running command.
set-window-option -g automatic-rename-format '#{b:pane_current_path}'

set -g renumber-windows on

# Name windows after the active pane's directory and running app.
set -g automatic-rename-format '#{b:pane_current_path} | #{pane_current_command}'

# Default 2000 fills up fast. Only applies to new panes: panes created earlier
# keep 2000 until `tmux respawn-pane`, so a full restart is what applies it
# everywhere. (36 of 76 panes are still at 2000.)
set -g history-limit 50000

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# 'on' writes pane scrollback to ~/.local/share/tmux/resurrect/pane_contents.tar.gz
# in plaintext, including `pass show` output. Re-enable only if you never view
# secrets in a pane. ponytail: all-or-nothing, the plugin has no per-pane exclusion.
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Configure Catppuccin theme (status indicators)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_color "#{@thm_overlay_2}"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_flags "icon"
# Read pane state directly so app-provided titles cannot replace the label.
# Long directory names are cut to 15 chars. Hide the command when it's just the shell; Claude Code's process name is its
# version (e.g. 2.1.304), so show "claude" instead.
set -g @catppuccin_window_text ' #{=/15/…:#{b:pane_current_path}}#{?#{m/r:^-?(zsh|bash|fish)$,#{pane_current_command}},, · #{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}}}'
set -g @catppuccin_window_current_text ' #{=/15/…:#{b:pane_current_path}}#{?#{m/r:^-?(zsh|bash|fish)$,#{pane_current_command}},, · #{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}}}'
set -g window-status-separator " "

# Sourced explicitly here, before the status line is built: catppuccin only
# defines @catppuccin_status_cpu when it loads, and that module is what carries
# the #{cpu_percentage} token. TPM sources it again later, harmlessly.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Hybrid setup: Use Catppuccin status with system info
# tmux runs #() commands at most once per second and only on a status interval,
# so the default 15 makes the CPU readout stale.
set -g status-interval 2
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# Memory. catppuccin ships no ram module, so this mirrors what its module
# builder emits for cpu: static colours (ram has no load thresholds) and
# tmux-cpu's #{ram_percentage} token, which cpu.tmux rewrites further down.
# No -F here on purpose: -F would collapse #{l:...}, and the token would then
# be expanded to nothing by the -F on the status-right line below.
set -g @catppuccin_status_ram "#[fg=#{@thm_peach}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_peach}]󰍛 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{l:#{ram_percentage}} #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"

# Codex usage countdown while Codex is focused; hides immediately on pane
# switches/exit, even while #() output is cached.
set -g status-right '#{?#{==:#{pane_current_command},codex},#("$HOME/.local/bin/codex-tmux-limits") │ ,}#{E:@catppuccin_status_application}'
# -F is required on this line. It expands the module here and now, which
# leaves a literal #{cpu_percentage} in status-right (catppuccin stores the
# module text with #{l:...}, so the token survives the expansion). cpu.tmux,
# run further down, rewrites that token into #(cpu_percentage.sh). With plain
# -ag the token is resolved at render time instead, where tmux has no idea what
# #{cpu_percentage} is and prints it verbatim - that was the visible bug.
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#{E:@catppuccin_status_session}"

set -g status-position bottom

# extended-keys on + csi-u: how Ghostty reports modified keys. tmux 3.5 defaults
# to off/xterm, so both lines are required for C-S-<key> bindings to arrive.
set -g extended-keys on
set -g extended-keys-format csi-u

# set -g pane-border-status top
# set -g pane-border-format " [ ###P #T ] "

# Must run after status-right is built above: this is what rewrites
# #{cpu_percentage} into the #() command tmux actually understands.
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.tmux/plugins/tpm/tpm'

# Override tmux-yank copy bindings.
# C-a y: copy the picked pane's address (session:window.pane) so it can be
# handed to another agent in a prompt. Press C-a y, then the pane's number;
# focus stays where it was. Must live below `run tpm` - it replaces tmux-yank's
# prefix-y (copy line); prefix-Y below still copies the last visible line.
# display-panes runs a single command, so the pane is not selected here: the
# inner tmux resolves the format against %% instead. #{l:...} is load-bearing -
# it stops the outer run-shell from expanding the format against the CURRENT pane.
bind-key y display-panes -d 0 "run-shell -b 'tmux display-message -p -t %% \"#{l:#{session_name}:#{window_index}.#{pane_index}}\" | pbcopy'"
bind-key -T copy-mode-vi 'Y' send -X select-line \; send -X copy-pipe-and-cancel "pbcopy" # copy current line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle # toggle block/rectangle selection
bind-key Y run-shell -b "tmux capture-pane -p -S -1 -E -1 | pbcopy" # copy last visible line
